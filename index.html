<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaClone Game</title>
    <style>
        /* CSS: Tampilan Website */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fafafa; color: #262626; }
        
        /* Navbar */
        .navbar { background: white; border-bottom: 1px solid #dbdbdb; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: bold; font-style: italic; }
        .nav-icons { font-size: 20px; cursor: pointer; }

        /* Container Utama */
        .container { max-width: 500px; margin: auto; padding-bottom: 60px; }

        /* Bagian Story */
        .stories { display: flex; padding: 15px; overflow-x: auto; background: white; border: 1px solid #dbdbdb; margin-top: 10px; border-radius: 8px; scrollbar-width: none; }
        .stories::-webkit-scrollbar { display: none; }
        .story-item { text-align: center; font-size: 11px; margin-right: 15px; cursor: pointer; }
        .circle { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 2px; margin-bottom: 5px; }
        .inner-circle { width: 100%; height: 100%; border-radius: 50%; background: white; padding: 2px; }
        .inner-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        /* Postingan */
        .post { background: white; border: 1px solid #dbdbdb; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        .post-header { padding: 12px; display: flex; align-items: center; font-weight: bold; }
        .post-header .avatar { width: 32px; height: 32px; border-radius: 50%; background: #ddd; margin-right: 10px; }
        .post-img { width: 100%; display: block; cursor: pointer; }
        .post-actions { padding: 12px; display: flex; gap: 15px; }
        .action-btn { background: none; border: none; font-size: 24px; cursor: pointer; transition: transform 0.1s; }
        .action-btn:active { transform: scale(1.2); }
        .likes-count { padding: 0 12px 10px; font-weight: bold; }
        .caption { padding: 0 12px 15px; font-size: 14px; }
        .caption strong { margin-right: 5px; }

        /* Tombol Upload (Game Feature) */
        .upload-section { padding: 10px; text-align: center; }
        input[type="file"] { display: none; }
        .btn-upload { background: #0095f6; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">InstaClone</div>
        <div class="nav-icons">🏠 💬 ➕ 🧭 ❤️</div>
    </nav>

    <div class="container">
        <section class="stories">
            <div class="story-item"><div class="circle"><div class="inner-circle"><img src="https://i.pravatar.cc/150?u=1"></div></div><span>Anda</span></div>
            <div class="story-item"><div class="circle"><div class="inner-circle"><img src="https://i.pravatar.cc/150?u=2"></div></div><span>Rizky</span></div>
            <div class="story-item"><div class="circle"><div class="inner-circle"><img src="https://i.pravatar.cc/150?u=3"></div></div><span>Salsa</span></div>
            <div class="story-item"><div class="circle"><div class="inner-circle"><img src="https://i.pravatar.cc/150?u=4"></div></div><span>Budi</span></div>
        </section>

        <div class="upload-section">
            <label for="fileInput" class="btn-upload">Posting Foto Baru</label>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div id="feed">
            <article class="post">
                <header class="post-header">
                    <div class="avatar"></div>
                    <span>gemini_user</span>
                </header>
                <img src="https://picsum.photos/500/500" class="post-img" ondblclick="handleLike(this)">
                <div class="post-actions">
                    <button class="action-btn" onclick="toggleLike(this)">🤍</button>
                    <button class="action-btn">💬</button>
                    <button class="action-btn">✈️</button>
                </div>
                <div class="likes-count"><span class="count">0</span> likes</div>
                <div class="caption"><strong>gemini_user</strong> Menikmati hari yang indah! ✨</div>
            </article>
        </div>
    </div>

    <script>
        // Fitur Like
        function toggleLike(btn) {
            const countSpan = btn.parentElement.nextElementSibling.querySelector('.count');
            let count = parseInt(countSpan.innerText);

            if (btn.innerHTML === '🤍') {
                btn.innerHTML = '❤️';
                btn.style.color = 'red';
                countSpan.innerText = count + 1;
            } else {
                btn.innerHTML = '🤍';
                btn.style.color = 'black';
                countSpan.innerText = count - 1;
            }
        }

        // Fitur Like lewat Double Click Gambar
        function handleLike(img) {
            const btn = img.nextElementSibling.querySelector('.action-btn');
            if (btn.innerHTML === '🤍') {
                toggleLike(btn);
            }
        }

        // Fitur Posting Foto Baru
        const fileInput = document.getElementById('fileInput');
        const feed = document.getElementById('feed');

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newPost = document.createElement('article');
                    newPost.className = 'post';
                    newPost.innerHTML = `
                        <header class="post-header">
                            <div class="avatar"></div>
                            <span>saya_sendiri</span>
                        </header>
                        <img src="${e.target.result}" class="post-img" ondblclick="handleLike(this)">
                        <div class="post-actions">
                            <button class="action-btn" onclick="toggleLike(this)">🤍</button>
                            <button class="action-btn">💬</button>
                            <button class="action-btn">✈️</button>
                        </div>
                        <div class="likes-count"><span class="count">0</span> likes</div>
                        <div class="caption"><strong>saya_sendiri</strong> Postingan baru saya! 📸</div>
                    `;
                    feed.prepend(newPost); // Tambah di paling atas
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
